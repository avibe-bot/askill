<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">askill publish terminal screenshot</title>
  <desc id="desc">A stylized terminal showing askill submit and publish commands.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="860" rx="24" fill="url(#bg3)"/>
  <rect x="36" y="36" width="1328" height="788" rx="16" fill="#020617" stroke="#334155"/>
  <circle cx="72" cy="68" r="8" fill="#ef4444"/>
  <circle cx="96" cy="68" r="8" fill="#f59e0b"/>
  <circle cx="120" cy="68" r="8" fill="#22c55e"/>
  <text x="156" y="74" fill="#94a3b8" font-family="SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="20">zsh - askill publish flow</text>

  <g fill="#e2e8f0" font-family="SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="24">
    <text x="72" y="132">$ askill submit https://github.com/yourname/my-skill-repo</text>
    <text x="72" y="178" fill="#93c5fd">Scanning repository...</text>
    <text x="72" y="224" fill="#93c5fd">Indexing SKILL.md candidates...</text>
    <text x="72" y="270" fill="#86efac">Submitted successfully for review</text>

    <text x="72" y="340">$ askill login --token ask_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx</text>
    <text x="72" y="386" fill="#86efac">Authenticated as @yourname</text>

    <text x="72" y="456">$ askill publish</text>
    <text x="72" y="502" fill="#93c5fd">Validating skill package...</text>
    <text x="72" y="548" fill="#93c5fd">Uploading metadata and SKILL.md...</text>
    <text x="72" y="594" fill="#86efac">Published @yourname/my-skill v1.0.0</text>

    <text x="72" y="694" fill="#fbbf24">Next: askill add @yourname/my-skill</text>
    <text x="72" y="744" fill="#64748b">Ship reusable agent skills with confidence.</text>
  </g>
</svg>
