<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">askill quickstart terminal screenshot</title>
  <desc id="desc">A stylized terminal showing askill install and list commands.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="860" rx="24" fill="url(#bg)"/>
  <rect x="36" y="36" width="1328" height="788" rx="16" fill="#020617" stroke="#1f2937"/>
  <circle cx="72" cy="68" r="8" fill="#ef4444"/>
  <circle cx="96" cy="68" r="8" fill="#f59e0b"/>
  <circle cx="120" cy="68" r="8" fill="#22c55e"/>
  <text x="156" y="74" fill="#94a3b8" font-family="SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="20">zsh - askill quickstart</text>

  <g fill="#e2e8f0" font-family="SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="26">
    <text x="72" y="132">$ curl -fsSL https://askill.sh | sh</text>
    <text x="72" y="176" fill="#86efac">Installing askill-cli...</text>
    <text x="72" y="220" fill="#86efac">Done. Run: askill --version</text>

    <text x="72" y="286">$ askill add @johndoe/awesome-tool</text>
    <text x="72" y="330" fill="#93c5fd">Resolving @johndoe/awesome-tool...</text>
    <text x="72" y="374" fill="#93c5fd">Installing into .agents/skills/awesome-tool</text>
    <text x="72" y="418" fill="#86efac">Installed successfully</text>

    <text x="72" y="484">$ askill list</text>
    <text x="72" y="528" fill="#cbd5e1">Installed skills (1)</text>
    <text x="72" y="572" fill="#e2e8f0">- awesome-tool   v1.2.0   local</text>

    <text x="72" y="682" fill="#22d3ee">Tip: use "askill check" to see available updates.</text>
    <text x="72" y="736" fill="#64748b">askill - the package manager for AI agent skills</text>
  </g>
</svg>
