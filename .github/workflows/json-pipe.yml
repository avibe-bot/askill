name: JSON pipe regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  json-pipe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          # Exercise the runtime that truncated console.log in the shipped CLI.
          # Newer Bun versions can mask the regression.
          bun-version: '1.3.14'
      - run: npm ci
      - run: npm run build:all
      - run: python3 test/e2e/json_pipe.py node dist/cli.mjs
      - run: python3 test/e2e/json_pipe.py dist/askill
