name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write  # Required for npm OIDC trusted publishing

env:
  GITHUB_REPO: ${{ github.repository }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            asset_name: askill-linux-x64
          - os: ubuntu-latest
            target: linux-arm64
            asset_name: askill-linux-arm64
          - os: macos-latest
            target: darwin-x64
            asset_name: askill-darwin-x64
          - os: macos-latest
            target: darwin-arm64
            asset_name: askill-darwin-arm64
          - os: windows-latest
            target: win32-x64
            asset_name: askill-win32-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: |
          bun build ./src/cli.ts --compile --target=bun-${{ matrix.target }} --outfile ./dist/${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ./dist/${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./dist/askill-linux-x64
            ./dist/askill-linux-arm64
            ./dist/askill-darwin-x64
            ./dist/askill-darwin-arm64
            ./dist/askill-win32-x64.exe
          generate_release_notes: true

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for npm OIDC trusted publishing
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      
      # Ensure npm is new enough for trusted publishing (requires 11.5.1+)
      - name: Check npm version
        run: npm --version
      
      - name: Install dependencies
        run: npm install
      
      - name: Build
        run: npm run build
      
      # npm Trusted Publishing - no token needed!
      # Provenance is automatically generated with OIDC
      - name: Publish to npm
        run: npm publish --access public
